name: README build

concurrency:
  group: profile-statistics
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  schedule:
    # 08:30, 14:30, and 20:30 in India time for morning/afternoon/evening greetings.
    - cron: "0 3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README statistics
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
          BIRTH_DATE: ${{ secrets.BIRTH_DATE }}
          TIME_ZONE: Asia/Kolkata
        run: python today.py

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          git diff --cached --quiet || git commit -m "Update GitHub profile stats"
          git push
